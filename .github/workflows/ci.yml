name: CI

# Phase 0 regression net: fast, deterministic checks on every PR.
# Type-check + lint only — `next build` runs on Netlify at deploy time (it
# fetches live CSV during prerender, which would make CI network-flaky).
# The color/RTL grep guards are added in roadmap Phase 10, not here, because
# they would fail against pre-migration code.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

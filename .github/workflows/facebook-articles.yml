name: Facebook Articles Autopost

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  post-facebook-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Post new published articles to Facebook
        env:
          NEWS_SHEET_CSV_URL: ${{ secrets.NEWS_SHEET_CSV_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB_NAME: ${{ secrets.SHEET_TAB_NAME }}
          MAX_POSTS_PER_RUN: ${{ secrets.MAX_POSTS_PER_RUN }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: node scripts/post_facebook_from_sheet.js

